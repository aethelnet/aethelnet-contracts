name: secret-scan

on:
  push:
  pull_request:

jobs:
  hardcoded-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if a 64-hex-character string (an Ethereum private key has this shape)
      # appears in source or config files. Verifier.sol contains zk verification
      # constants of the same length, and the lockfile has integrity hashes, so they
      # are excluded.
      - name: No hard-coded private keys
        run: |
          matches=$(git grep -nIE '(0x)?[0-9a-fA-F]{64}' -- \
            ':!package-lock.json' ':!contracts/Verifier.sol' ':!circuits/' || true)
          if [ -n "$matches" ]; then
            echo "::error::Possible hard-coded private key. Use SEPOLIA_PRIVATE_KEY in .env or 'npx hardhat vars set' instead."
            echo "$matches" | sed -E 's/[0-9a-fA-F]{64}/<REDACTED>/g'
            exit 1
          fi
          echo "No hard-coded keys found."
